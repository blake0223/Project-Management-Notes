<!-- manualJobEntry.html -->
<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <title>Manual Job Entry</title>
  <style>
    body { font: 14px/1.4 Arial, sans-serif; margin: 20px; }
    h1 { margin: 0 0 14px 0; font-size: 18px; }
    .form-grid { display: grid; grid-template-columns: 170px 1fr; gap: 8px 12px; align-items: center; max-width: 520px; }
    label { color: #555; font-weight: 600; }
    input, select { padding: 6px 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; width: 100%; }
    input:focus, select:focus { outline: none; border-color: #4285f4; box-shadow: 0 0 0 2px rgba(66,133,244,.2); }
    .req::after { content: ' *'; color: #c00; }
    .actions { display: flex; gap: 8px; margin-top: 16px; }
    button { padding: 8px 16px; cursor: pointer; border: 1px solid #ccc; border-radius: 4px; background: #fff; }
    button.primary { background: #4285f4; color: #fff; border-color: #4285f4; }
    button.primary:hover { background: #3367d6; }
    button:disabled { opacity: .6; cursor: default; }
    .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid #fff; border-top-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; margin-left: 6px; vertical-align: text-bottom; }
    .hidden { display: none; }
    .err { color: #c00; font-size: 12px; margin-top: 4px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <h1>Manual Job Entry</h1>
  <p style="color:#555;margin:0 0 12px 0;">Adds a row to Data!M:U. Fields marked * are required.</p>

  <div class="form-grid">
    <label class="req" for="jobName">Job Name</label>
    <input id="jobName" type="text" placeholder="e.g. Smith Residence">

    <label class="req" for="pipedriveId">Pipedrive ID</label>
    <input id="pipedriveId" type="text" placeholder="e.g. 12345">

    <label class="req" for="salesman">Salesman</label>
    <select id="salesman"><option value="">Loading…</option></select>

    <label for="startDate">Start Date</label>
    <input id="startDate" type="date">

    <label class="req" for="dealValue">Deal Value</label>
    <input id="dealValue" type="number" step="0.01" min="0" placeholder="0.00">

    <label class="req" for="estMaterial">Estimated Material</label>
    <input id="estMaterial" type="number" step="0.01" min="0" placeholder="0.00">

    <label class="req" for="estMandays">Estimated Mandays</label>
    <input id="estMandays" type="number" step="0.01" min="0" placeholder="0.00">

    <label for="materialLink">Material List Link</label>
    <input id="materialLink" type="url" placeholder="https://...">
  </div>

  <div id="errMsg" class="err hidden"></div>

  <div class="actions">
    <button id="saveBtn" class="primary" type="button">Save Job <span id="spinSave" class="spinner hidden"></span></button>
    <button id="closeBtn" type="button">Close</button>
  </div>

  <script>
    function showErr(msg) {
      var el = document.getElementById('errMsg');
      if (msg) { el.textContent = msg; el.classList.remove('hidden'); }
      else { el.textContent = ''; el.classList.add('hidden'); }
    }
    function setBusy(b) {
      document.getElementById('saveBtn').disabled = !!b;
      var sp = document.getElementById('spinSave');
      if (b) sp.classList.remove('hidden'); else sp.classList.add('hidden');
    }

    function init() {
      document.getElementById('closeBtn').addEventListener('click', function() { google.script.host.close(); });
      document.getElementById('saveBtn').addEventListener('click', save);

      google.script.run
        .withSuccessHandler(function(list) {
          var sel = document.getElementById('salesman');
          sel.innerHTML = '<option value="">— Select —</option>';
          (list || []).forEach(function(name) {
            var o = document.createElement('option');
            o.value = name;
            o.textContent = name;
            sel.appendChild(o);
          });
        })
        .withFailureHandler(function(err) {
          document.getElementById('salesman').innerHTML = '<option value="">Failed to load</option>';
        })
        .getManualEntrySalesmen();
    }

    function save() {
      showErr('');
      var jobName     = document.getElementById('jobName').value.trim();
      var pipedriveId = document.getElementById('pipedriveId').value.trim();
      var salesman    = document.getElementById('salesman').value;
      var startDate   = document.getElementById('startDate').value;
      var dealValue   = document.getElementById('dealValue').value;
      var estMaterial = document.getElementById('estMaterial').value;
      var estMandays  = document.getElementById('estMandays').value;
      var materialLink = document.getElementById('materialLink').value.trim();

      if (!jobName)     { showErr('Job Name is required.'); return; }
      if (!pipedriveId) { showErr('Pipedrive ID is required.'); return; }
      if (!salesman)    { showErr('Salesman is required.'); return; }
      if (!dealValue)   { showErr('Deal Value is required.'); return; }
      if (!estMaterial) { showErr('Estimated Material is required.'); return; }
      if (!estMandays)  { showErr('Estimated Mandays is required.'); return; }

      setBusy(true);
      google.script.run
        .withSuccessHandler(function(res) {
          setBusy(false);
          if (res && res.ok) {
            google.script.run.showUiMessage('info', 'Job saved to Data!M:T (row ' + res.row + ').');
            // Clear form
            document.getElementById('jobName').value = '';
            document.getElementById('pipedriveId').value = '';
            document.getElementById('salesman').value = '';
            document.getElementById('startDate').value = '';
            document.getElementById('dealValue').value = '';
            document.getElementById('estMaterial').value = '';
            document.getElementById('estMandays').value = '';
            document.getElementById('materialLink').value = '';
          } else {
            showErr(res && res.reason ? res.reason : 'Save failed.');
          }
        })
        .withFailureHandler(function(err) {
          setBusy(false);
          showErr('Save failed: ' + (err && err.message ? err.message : err));
        })
        .saveManualJobEntry({
          jobName: jobName,
          pipedriveId: pipedriveId,
          salesman: salesman,
          startDate: startDate,
          dealValue: parseFloat(dealValue),
          estMaterial: parseFloat(estMaterial),
          estMandays: parseFloat(estMandays),
          materialLink: materialLink
        });
    }

    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
    else init();
  </script>
</body>
</html>
