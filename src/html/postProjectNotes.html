<!-- postProjectNotes.html (NEW FILE) -->
<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <title>Post-Project Notes</title>
  <style>
    body { font: 14px/1.4 Arial, sans-serif; margin: 16px; }
    h1 { margin: 0 0 10px 0; font-size: 18px; }
    .grid { display:grid; grid-template-columns: 360px 1fr; gap: 12px; }
    .box { border:1px solid #ccc; border-radius:8px; padding:10px; }
    .list { max-height: 640px; overflow:auto; border:1px solid #eee; border-radius:6px; }
    .item { padding:8px 10px; border-bottom:1px solid #eee; cursor:pointer; }
    .item:hover { background:#fafafa; }
    .item.active { background:#eaf2ff; }
    .muted { color:#666; font-size:12px; }
    .row { margin: 6px 0; }
    .label { display:inline-block; width:170px; color:#555; }
    textarea { width:100%; min-height:240px; box-sizing:border-box; resize:vertical; }
    .actions { display:flex; gap:8px; margin-top:10px; }
    button { padding:8px 12px; cursor:pointer; }
    .spinner { display:inline-block; width:16px; height:16px; border:2px solid #ccc; border-top-color:#333; border-radius:50%; animation:spin .9s linear infinite; margin-left:8px; vertical-align:text-bottom; }
    .load-spinner { display:flex; align-items:center; justify-content:center; padding:40px 0; }
    .load-spinner .spinner { margin-left:0; width:28px; height:28px; border-width:3px; }
    .hidden { display:none; }
    @keyframes spin { to { transform: rotate(360deg); } }
    a { color:#1155cc; }
    .followup-check { display:flex; align-items:center; gap:6px; margin:8px 0 0 0; padding:8px; background:#fff8e1; border:1px solid #ffe082; border-radius:6px; }
    .followup-check input { margin:0; }
    .followup-check label { font-weight:600; color:#795548; cursor:pointer; }
    .overlay { position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,.4); display:flex; align-items:center; justify-content:center; z-index:100; }
    .overlay-box { background:#fff; border-radius:10px; padding:20px; width:520px; max-width:90vw; box-shadow:0 4px 24px rgba(0,0,0,.2); }
    .overlay-box h2 { margin:0 0 12px 0; font-size:16px; }
    .fu-grid { display:grid; grid-template-columns:160px 1fr; gap:8px 10px; align-items:center; }
    .fu-grid label { color:#555; font-weight:600; }
    .fu-grid input, .fu-grid textarea { padding:6px 8px; border:1px solid #ccc; border-radius:4px; box-sizing:border-box; width:100%; }
    .fu-grid textarea { min-height:80px; resize:vertical; }
    .fu-actions { display:flex; gap:8px; margin-top:14px; }
    .fu-actions button { padding:8px 14px; }
    .fu-actions .primary { background:#4285f4; color:#fff; border:1px solid #4285f4; border-radius:4px; }
    .fu-actions .primary:hover { background:#3367d6; }
  </style>
</head>
<body>
  <h1>Post-Project Notes</h1>

  <div class="grid">
    <div class="box">
      <div class="row"><b>Select a job from Data</b></div>
      <input id="jobSearch" type="text" placeholder="Search by job name…"
             style="width:100%;box-sizing:border-box;padding:6px 8px;margin-bottom:6px;border:1px solid #ccc;border-radius:4px;">
      <div id="jobList" class="list"><div class="item">Loading…</div></div>
    </div>

    <div class="box">
      <div id="details">
        <div class="muted">Select a job to view details.</div>
      </div>

      <div id="notesSection" class="hidden">
        <div class="row" style="margin-top:10px;">
          <b>Post-Project Notes</b>
        </div>
        <textarea id="postNotes" placeholder="Write post-project notes here…"></textarea>

        <div class="followup-check">
          <input type="checkbox" id="needsFollowUp">
          <label for="needsFollowUp">Needs Follow Up?</label>
        </div>

        <div class="actions">
          <button id="saveBtn" type="button">Save Note <span id="spinSave" class="spinner hidden"></span></button>
          <button id="closeBtn" type="button">Close</button>
        </div>
      </div>
    </div>
  </div>

  <div id="followUpOverlay" class="overlay hidden">
    <div class="overlay-box">
      <h2>Customer Follow Up</h2>
      <div class="fu-grid">
        <label>Customer Name</label>
        <input id="fuCustomer" type="text" readonly style="background:#f5f5f5;">
        <label>Address</label>
        <input id="fuAddress" type="text" placeholder="Job address">
        <label>Phone</label>
        <input id="fuPhone" type="tel" placeholder="Phone number">
        <label>Email</label>
        <input id="fuEmail" type="email" placeholder="Email address">
        <label>PM Responsible</label>
        <input id="fuPM" type="text" placeholder="Project Manager">
        <label>Reason for Follow Up</label>
        <textarea id="fuReason" placeholder="Describe the issue or reason…"></textarea>
      </div>
      <div class="fu-actions">
        <button class="primary" id="fuSubmitBtn" type="button">Submit Follow Up <span id="spinFU" class="spinner hidden"></span></button>
        <button id="fuCancelBtn" type="button">Cancel</button>
      </div>
    </div>
  </div>

  <script>
    function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
    function setBusy(b){
      var btn=document.getElementById('saveBtn');
      var sp=document.getElementById('spinSave');
      if(btn) btn.disabled=!!b;
      if(sp){ if(b) sp.classList.remove('hidden'); else sp.classList.add('hidden'); }
    }
    function ensureHttp(u){
      if(!u) return '';
      if(/^https?:\/\//i.test(u)) return u;
      if(/^www\./i.test(u)) return 'https://'+u;
      if(/^[A-Za-z0-9.-]+\.[A-Za-z]{2,}($|[\/?#])/i.test(u)) return 'https://'+u;
      return u;
    }
    function escAttrUrl(u){try{return encodeURI(u).replace(/"/g,'%22').replace(/'/g,'%27');}catch(e){return u;}}

    var jobs = [];
    var selectedRow = null;
    var selectedJobName = '';

    function renderList(){
      var host=document.getElementById('jobList');
      var filter=(document.getElementById('jobSearch').value||'').toLowerCase();
      var filtered=jobs.filter(function(j){
        return !filter || (j.projectName||'').toLowerCase().indexOf(filter)!==-1;
      });
      if(!filtered.length){
        host.innerHTML = filter
          ? '<div class="item">No jobs match "'+escapeHtml(filter)+'".</div>'
          : '<div class="item">No jobs found in Data!A.</div>';
        return;
      }
      var html=[];
      for(var i=0;i<filtered.length;i++){
        var j=filtered[i];
        var active = (selectedRow === j.row) ? ' active' : '';
        html.push(
          '<div class="item'+active+'" data-row="'+j.row+'">' +
            '<div><b>'+escapeHtml(j.projectName)+'</b></div>' +
            '<div class="muted">Salesman: '+escapeHtml(j.salesman||'')+' | ID: '+escapeHtml(j.pipedriveId||'')+'</div>' +
          '</div>'
        );
      }
      host.innerHTML = html.join('');
      host.querySelectorAll('.item[data-row]').forEach(function(el){
        el.addEventListener('click', function(){
          var r = +el.getAttribute('data-row');
          selectRow(r);
        });
      });
    }

    function renderDetails(d){
      var host=document.getElementById('details');
      if(!d){
        host.innerHTML = '<div class="muted">Select a job to view details.</div>';
        return;
      }

      var ml = ensureHttp(d.materialList||'');
      var mlHtml = ml ? ('<a href="'+escAttrUrl(ml)+'" target="_blank" rel="noopener">Open</a>') : '-';

      host.innerHTML =
        '<div class="row"><b>'+escapeHtml(d.projectName||'')+'</b></div>' +
        '<div class="row"><span class="label">Pipedrive ID:</span> '+escapeHtml(d.pipedriveId||'')+'</div>' +
        '<div class="row"><span class="label">Salesman:</span> '+escapeHtml(d.salesman||'')+'</div>' +
        '<div class="row"><span class="label">Reviewed by:</span> '+escapeHtml(d.reviewedBy||'')+'</div>' +
        '<div class="row"><span class="label">Project Start Date:</span> '+escapeHtml(d.startDate||'')+'</div>' +
        '<div class="row"><span class="label">Material List:</span> '+mlHtml+'</div>' +
        '<div class="row"><span class="label">Estimated Material:</span> '+escapeHtml(d.estMaterial==null?'':String(d.estMaterial))+'</div>' +
        '<div class="row"><span class="label">Estimated Mandays:</span> '+escapeHtml(d.estMandays==null?'':String(d.estMandays))+'</div>' +
        '<div class="row"><span class="label">PM Notes:</span> '+escapeHtml(d.pmNotes||'')+'</div>';
    }

    function selectRow(row){
      selectedRow = row;
      renderList();

      document.getElementById('details').innerHTML = '<div class="load-spinner"><span class="spinner"></span></div>';
      document.getElementById('notesSection').classList.add('hidden');

      google.script.run
        .withSuccessHandler(function(d){
          renderDetails(d);
          selectedJobName = (d && d.projectName) || '';
          document.getElementById('postNotes').value = (d && d.postNotes) ? d.postNotes : '';
          document.getElementById('needsFollowUp').checked = false;
          document.getElementById('notesSection').classList.remove('hidden');
        })
        .withFailureHandler(function(err){
          document.getElementById('details').innerHTML = '<div class="muted">Failed to load details.</div>';
          google.script.run.showUiMessage('error', 'Load details failed: ' + (err && err.message ? err.message : err));
        })
        .getPostProjectJobDetails(row);
    }

    // Follow-up overlay logic
    function showFollowUp(customerName){
      document.getElementById('fuCustomer').value = customerName || '';
      document.getElementById('fuAddress').value = '';
      document.getElementById('fuPhone').value = '';
      document.getElementById('fuEmail').value = '';
      document.getElementById('fuPM').value = '';
      document.getElementById('fuReason').value = '';
      document.getElementById('followUpOverlay').classList.remove('hidden');
    }
    function hideFollowUp(){
      document.getElementById('followUpOverlay').classList.add('hidden');
    }
    function submitFollowUp(){
      var data = {
        customerName: document.getElementById('fuCustomer').value.trim(),
        phone: document.getElementById('fuPhone').value.trim(),
        email: document.getElementById('fuEmail').value.trim(),
        address: document.getElementById('fuAddress').value.trim(),
        pmResponsible: document.getElementById('fuPM').value.trim(),
        reason: document.getElementById('fuReason').value.trim()
      };
      if(!data.reason){
        google.script.run.showUiMessage('warning','Please enter a reason for follow up.');
        return;
      }
      var btn=document.getElementById('fuSubmitBtn'), sp=document.getElementById('spinFU');
      btn.disabled=true; sp.classList.remove('hidden');
      google.script.run
        .withSuccessHandler(function(res){
          btn.disabled=false; sp.classList.add('hidden');
          if(res && res.ok){
            hideFollowUp();
            google.script.run.showUiMessage('info','Saved note and follow up.');
          } else {
            google.script.run.showUiMessage('error','Follow up save failed: '+(res&&res.reason||'unknown'));
          }
        })
        .withFailureHandler(function(err){
          btn.disabled=false; sp.classList.add('hidden');
          google.script.run.showUiMessage('error','Follow up save failed: '+(err&&err.message?err.message:err));
        })
        .saveFollowUp(data);
    }

    function save(){
      if(!selectedRow){
        google.script.run.showUiMessage('warning','Select a job first.');
        return;
      }
      var txt = document.getElementById('postNotes').value || '';
      var wantsFollowUp = document.getElementById('needsFollowUp').checked;
      setBusy(true);
      google.script.run
        .withSuccessHandler(function(res){
          setBusy(false);
          if(res && res.ok){
            if(wantsFollowUp){
              showFollowUp(selectedJobName);
            } else {
              google.script.run.showUiMessage('info','Saved to Data!AD.');
            }
          } else {
            google.script.run.showUiMessage('warning','Save failed.');
          }
        })
        .withFailureHandler(function(err){
          setBusy(false);
          google.script.run.showUiMessage('error','Save failed: ' + (err && err.message ? err.message : err));
        })
        .savePostProjectNote(selectedRow, txt);
    }

    function init(){
      document.getElementById('saveBtn').addEventListener('click', save);
      document.getElementById('closeBtn').addEventListener('click', function(){ google.script.host.close(); });
      document.getElementById('jobSearch').addEventListener('input', function(){ renderList(); });
      document.getElementById('fuSubmitBtn').addEventListener('click', submitFollowUp);
      document.getElementById('fuCancelBtn').addEventListener('click', function(){ hideFollowUp(); });

      google.script.run
        .withSuccessHandler(function(list){
          jobs = list || [];
          renderList();
        })
        .withFailureHandler(function(err){
          jobs = [];
          renderList();
          google.script.run.showUiMessage('error','Load jobs failed: ' + (err && err.message ? err.message : err));
        })
        .getPostProjectJobs();
    }

    if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', init);
    else init();
  </script>
</body>
</html>
